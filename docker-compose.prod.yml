# Runs the Drift Tennis production stack.
#
# Each app service names both an `image:` and a `build:`. With both present,
# `docker compose up` uses the image when one is available and `docker compose
# build` builds and tags it locally — so the same file serves a box that builds
# for itself and a box that pulls what CI already built (tracker 5.2).
#
#   DRIFT_IMAGE_TAG unset  -> :local, built on this machine, today's behaviour
#   DRIFT_IMAGE_TAG=sha-…  -> pulls that exact image from GHCR, and rolling back
#                             is re-running with the previous sha- tag
#
# The console images bake the API origin in at build time, so a pulled image is
# already bound to one environment. Do not expect PUBLIC_API_URL to re-point one.
#
# Runs on the shared box (46.225.106.43) alongside RetailFlow and harusi-ke.
# `name:` is set explicitly below so Compose's project name (and therefore its
# default network name) doesn't collide with harusi-ke, whose containers on
# this same box already come from an unnamed project in a directory also
# called "prod" (prod-postgres-1, etc.) — an unnamed project here would clash
# with or silently reuse that network. mem_limit values are sized to the
# runbook's shared-box budget (SHARED_BOX_CAPACITY.md §4), not to this box's
# full headroom.

name: drift-prod

services:
  postgres:
    image: postgres:16-bookworm
    container_name: drift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 384m
    cpus: "0.30"

  redis:
    image: redis:7.4-bookworm
    container_name: drift-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 128m
    cpus: "0.15"

  api:
    build:
      context: ./backend
    container_name: drift-api
    image: ghcr.io/${DRIFT_IMAGE_OWNER:-lyomu}/drift-api:${DRIFT_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - path: ./.env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: 3009
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3005:3009"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3009/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 448m
    cpus: "0.40"

  club-admin:
    build:
      context: ./club-admin
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    container_name: drift-club-admin
    image: ghcr.io/${DRIFT_IMAGE_OWNER:-lyomu}/drift-club-admin:${DRIFT_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3010
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3006:3010"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3010/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 256m
    cpus: "0.25"

  # Routed at its own subdomain (platform.<domain>) rather than a /platform
  # path prefix, so no NEXT_PUBLIC_BASE_PATH build arg is needed.
  platform-admin:
    build:
      context: ./platform-admin
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    container_name: drift-platform-admin
    image: ghcr.io/${DRIFT_IMAGE_OWNER:-lyomu}/drift-platform-admin:${DRIFT_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3011
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3007:3011"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3011/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 192m
    cpus: "0.20"

  website:
    build:
      context: ./website
    container_name: drift-website
    image: ghcr.io/${DRIFT_IMAGE_OWNER:-lyomu}/drift-website:${DRIFT_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3012
      HOSTNAME: 0.0.0.0
      # Server-side only (see website/app/api/waitlist/route.ts) — the
      # waitlist proxy hops to the API container over the compose network,
      # not to whatever `localhost` means inside this container.
      API_URL: http://api:3009
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3008:3012"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3012/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 256m
    cpus: "0.25"

volumes:
  postgres_data:
  redis_data:
