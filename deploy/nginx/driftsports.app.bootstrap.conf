# Bootstrap-phase (HTTP-only) vhost for driftsports.app — installed before
# DNS points here / before the cert exists. Once certbot issues the real
# cert, replace this with deploy/nginx/driftsports.app.conf (the full file,
# 443 blocks included) — see that file's own header for the two-step process.

server {
    listen 80;
    listen [::]:80;
    server_name driftsports.app www.driftsports.app admin.driftsports.app console.driftsports.app api.driftsports.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
