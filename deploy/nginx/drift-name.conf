# Name vhost for drift.einsbrand.com (tracker 2.1 / 2.2).
#
# RECONSTRUCTED, NOT COPIED. The live file was created directly on the box on
# 2026-09-02 and has never been in this repository, which is the problem this
# file exists to fix: production nginx config that lives only on one host is
# config nobody can review, diff, or restore. Before trusting this copy, diff it
# against the box:
#
#   diff /etc/nginx/conf.d/drift-name.conf deploy/nginx/drift-name.conf
#
# and treat the box as the source of truth for any difference, then update this
# file to match. The routing below mirrors drift-ip-https.conf exactly, because
# both vhosts front the same three upstreams.

server {
    listen 80;
    listen [::]:80;
    server_name drift.einsbrand.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drift.einsbrand.com;

    # 90-day Let's Encrypt certificate, issued 2026-09-02. The renewal config
    # inherits renew_hook = systemctl reload nginx (tracker 0.1) — without it a
    # renewed certificate lands on disk while nginx keeps serving the old one
    # from memory, which surfaces to users as a generic TLS failure in the app.
    ssl_certificate /etc/letsencrypt/live/drift.einsbrand.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drift.einsbrand.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    # HSTS is deliberately NOT enabled here yet. It is close to irreversible —
    # every browser that sees it refuses plain HTTP for max-age regardless of
    # what the server later says — so it belongs after the domain is confirmed
    # permanent and public launch has happened, not during a staging preview
    # that still keeps an IP vhost alive as a fallback. When you do add it:
    #   add_header Strict-Transport-Security "max-age=31536000" always;
    # Add includeSubDomains only if every einsbrand.com subdomain is HTTPS, and
    # do not add preload until you are certain, because removal takes months.

    auth_basic "Drift Tennis staging";
    auth_basic_user_file /etc/nginx/.htpasswd-drift;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        default_type "text/plain";
    }

    # The API and websocket routes are not behind basic auth: mobile clients
    # cannot answer a browser credential prompt.
    location ^~ /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3009/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api {
        auth_basic off;
        return 308 /api/;
    }

    location ^~ /socket.io/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /platform/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /platform {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
