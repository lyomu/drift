# Reverse proxy for Drift Tennis prod, shared box 46.225.106.43.
# Shape copied from devops-infra/nginx/harusi.ke.conf (per-service routing,
# one cert covering every subdomain on this box), not the old single-app
# drift-name.conf this replaces — that one fronted a bare-IP/path-based
# deploy on a now-deleted dedicated box.
#
# Mapping (matches drift-prod's compose port block):
#   driftsports.app, www.driftsports.app -> website        127.0.0.1:3008
#   admin.driftsports.app                -> club-admin      127.0.0.1:3006  (basic auth)
#   console.driftsports.app             -> platform-admin  127.0.0.1:3007  (basic auth)
#   api.driftsports.app                  -> api + socket.io 127.0.0.1:3005  (no basic auth —
#                                            mobile/browser clients can't answer a
#                                            credential prompt)
#
# DEPLOY IN TWO STEPS (same pattern as harusi.ke.conf / the old drift-ip
# bootstrap):
#   1. Deploy this file with every `listen 443` block removed/commented out
#      (keep only the port-80 block), `nginx -t && nginx -s reload`, then get
#      one cert covering all 5 names:
#        certbot certonly --webroot -w /var/www/certbot \
#          -d driftsports.app -d www.driftsports.app -d admin.driftsports.app \
#          -d console.driftsports.app -d api.driftsports.app
#   2. Restore the 443 blocks below, `nginx -t && nginx -s reload`.
#   3. `chown drift-deploy:drift-deploy /etc/nginx/sites-available/driftsports.app`
#      and symlink it into sites-enabled — this box uses the
#      sites-available/sites-enabled convention for new products (runbook §6),
#      not harusi-ke's conf.d style.
#
# HSTS is deliberately not enabled yet — see the old drift-name.conf's note;
# add it only once the domain is confirmed permanent.

server {
    listen 80;
    listen [::]:80;
    server_name driftsports.app www.driftsports.app admin.driftsports.app console.driftsports.app api.driftsports.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- website (marketing/landing): driftsports.app, www.driftsports.app ---
# Apex is canonical; www redirects rather than getting its own proxy block.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.driftsports.app;

    ssl_certificate /etc/letsencrypt/live/driftsports.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/driftsports.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://driftsports.app$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name driftsports.app;

    ssl_certificate /etc/letsencrypt/live/driftsports.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/driftsports.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- club-admin: admin.driftsports.app ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.driftsports.app;

    ssl_certificate /etc/letsencrypt/live/driftsports.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/driftsports.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    # Not for search engines: the apps behind this host are logins and APIs.
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic "Drift Tennis club admin";
    auth_basic_user_file /etc/nginx/.htpasswd-drift;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- platform-admin: console.driftsports.app ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.driftsports.app;

    ssl_certificate /etc/letsencrypt/live/driftsports.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/driftsports.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    # Not for search engines: the apps behind this host are logins and APIs.
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic "Drift Tennis platform admin";
    auth_basic_user_file /etc/nginx/.htpasswd-drift;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- API + Socket.IO: api.driftsports.app ---
# Not behind basic auth: mobile clients cannot answer a browser credential
# prompt, and the website/consoles call this origin directly from the browser.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.driftsports.app;

    ssl_certificate /etc/letsencrypt/live/driftsports.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/driftsports.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    # Not for search engines: the apps behind this host are logins and APIs.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
