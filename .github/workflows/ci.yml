name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drift
          POSTGRES_PASSWORD: drift
          POSTGRES_DB: drift_tennis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drift -d drift_tennis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://drift:drift@localhost:5432/drift_tennis_ci
      JWT_SECRET: ci-only-drift-tennis-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Build backend
        run: npm run build
      - name: Run backend unit tests
        run: npm test -- --runInBand
      - name: Run backend end-to-end tests
        run: npm run test:e2e

  mobile:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.35.6
          cache: true
      - name: Install dependencies from lockfile
        run: flutter pub get --enforce-lockfile
      - name: Analyze Flutter app
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        run: flutter test --no-pub

  club-admin:
    name: Club Admin production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: club-admin
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: club-admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Club Admin
        run: npm run build

  platform-admin:
    name: Platform Admin production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform-admin
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform-admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Platform Admin
        run: npm run build
